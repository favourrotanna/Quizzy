<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Quizzy </title>
</head>
<body>
  <h1>Quizzy</h1>

  <div class="quiz-card">

  <h2 class="question"></h2>

  <button class="back-to-categories">Back to categories</button>
  
  <span class="question-progress">Question 1 of 5</span>

  <progress class="progress-bar"></progress>

  <span class=" quiz-timer">Time: 15s</span>

  <ul class="options"></ul>

  <p class="feedback"></p>

  <p class="result"></p>

  <button class="nextQuestion">Next Question</button>

  <button class="restartQuiz">Restart Quiz</button>

  
<div class="result-popup">

  <h2>Quiz Results</h2>

  <p class="final-score"></p>

  <p class="final-percentage"></p>

  <p class="performance-message"></p>

  <button class="closeResult">Close</button>
</div>

</div>


 <script src="script.js"></script>
</body>
</html>
